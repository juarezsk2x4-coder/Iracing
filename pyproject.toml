[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iracing-analyzer"
version = "0.1.0"
description = "iRacing .ibt telemetry analyzer with weakness diagnosis and coaching output"
requires-python = ">=3.9"
dependencies = [
    "pyirsdk>=1.3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
fast = ["numpy>=1.24"]

[project.scripts]
iracing-analyze = "iracing_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["iracing_analyzer*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["data/*.yaml"]
